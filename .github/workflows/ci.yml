name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with: { use-mathlib-cache: true }
      # Compiled Verso and checkdecls, restored after lake has cloned the
      # packages.  Mathlib comes from its own cache above.
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages/verso/.lake
            .lake/packages/subverso/.lake
            .lake/packages/MD4Lean/.lake
            .lake/packages/illuminate/.lake
            .lake/packages/checkdecls/.lake
          key: lake-deps-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      # Fails on any sorry not tagged @[open_question], before anything renders.
      - run: lake exe status
      - run: python3 scripts/render_status.py
      - run: lake build Review && lake exe review-doc --output build/review
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y graphviz libgraphviz-dev
      - name: Install TinyTeX
        run: |
          curl -sL "https://yihui.org/tinytex/install-bin-unix.sh" | sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/tlmgr" update --self
          # Every package the PDF build loads, from blueprint/print/print.fls.
          "$HOME/bin/tlmgr" install latexmk xetex lm lm-math zapfding \
            amscls amsfonts amsmath mathtools tools geometry fontspec unicode-math \
            l3kernel l3packages etoolbox graphics graphics-cfg graphics-def \
            hyperref hycolor url iftex infwarerr intcalc kvdefinekeys kvoptions \
            kvsetkeys ltxcmds pdfescape pdftexcmds refcount rerunfilecheck \
            stringenc uniquecounter bigintcalc bitset gettitlestring
      - run: pip install leanblueprint
      # web writes blueprint/lean_decls, which checkdecls reads.
      - run: leanblueprint web && leanblueprint checkdecls && leanblueprint pdf
      - run: |
          mkdir -p site/blueprint
          cp -r build/review/html-multi/. site/
          cp -r pages/. site/
          cp -r blueprint/web/. site/blueprint/
          cp blueprint/print/print.pdf site/blueprint/print.pdf
          cp build/ears.md build/ears.csv build/status.json site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  # Deploys only once Pages is available for the repository: set the
  # repository variable PAGES_ENABLED to true after turning Pages on.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
