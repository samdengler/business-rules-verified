name: CI
on:
  # A push that changes only the README or docs/ leaves the site unchanged.
  push: { branches: [main], paths-ignore: ["README.md", "docs/**"] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This repository's compiled Lean from the last run.  Lake rebuilds only
      # the modules whose sources changed; the review-doc link is the slow step.
      - uses: actions/cache@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', '*.lean', 'Rules/**/*.lean', 'Review/**/*.lean', 'Oracle/**/*.lean', 'Airline/**/*.lean', 'Status/**/*.lean', 'Verify/**/*.lean') }}
          restore-keys: lake-build-${{ runner.os }}-
      - uses: leanprover/lean-action@v1
        with: { use-mathlib-cache: true }
      # Compiled Verso, checkdecls and Aeneas's Lean library, restored after
      # lake has cloned the packages.  Mathlib comes from its own cache above.
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages/verso/.lake
            .lake/packages/subverso/.lake
            .lake/packages/MD4Lean/.lake
            .lake/packages/illuminate/.lake
            .lake/packages/checkdecls/.lake
            .lake/packages/aeneas/backends/lean/.lake
          key: lake-deps-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      # Graphviz draws the delivery state diagram (render_status.py) and the
      # blueprint's dependency graph.
      - run: sudo apt-get update && sudo apt-get install -y graphviz libgraphviz-dev
      # Fails on any sorry not tagged @[open_question], before anything renders.
      - run: lake exe status
      # Parliament Air's fares, evaluated by the model's functions for the
      # airline pages.  Fails if two readings of the guide disagree.
      - run: lake build Airline airline-facts && mkdir -p build/airline && lake exe airline-facts > build/airline/facts.json
      - run: python3 scripts/render_status.py
      # The Kiro specs are committed; a change to the model must commit them too.
      - name: Check .kiro/specs is up to date
        run: |
          if [ -n "$(git status --porcelain -- .kiro/specs)" ]; then
            git status --porcelain -- .kiro/specs
            git diff -- .kiro/specs
            echo "::error::.kiro/specs differs from the model; run lake exe status && python3 scripts/render_status.py and commit .kiro/specs"
            exit 1
          fi
      - run: lake build Review && lake exe review-doc --output build/review
      # Implementation checks: the Java code against the model's test oracle.
      - run: lake build Oracle oracle && mkdir -p build/oracle && lake exe oracle --vectors > build/oracle/vectors.jsonl
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -f impl/java/pom.xml verify
      # Option 3: the proofs that the Rust translation computes what the model computes.
      - run: lake build Verify
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install TinyTeX
        run: |
          curl -sL "https://yihui.org/tinytex/install-bin-unix.sh" | sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/tlmgr" update --self
          # Every package the PDF build loads, from blueprint/print/print.fls.
          "$HOME/bin/tlmgr" install latexmk xetex lm lm-math zapfding \
            amscls amsfonts amsmath mathtools tools geometry fontspec unicode-math \
            l3kernel l3packages etoolbox graphics graphics-cfg graphics-def \
            hyperref hycolor url iftex infwarerr intcalc kvdefinekeys kvoptions \
            kvsetkeys ltxcmds pdfescape pdftexcmds refcount rerunfilecheck \
            stringenc uniquecounter bigintcalc bitset gettitlestring
      - run: pip install leanblueprint
      # web writes blueprint/lean_decls, which checkdecls reads.
      - run: leanblueprint web && leanblueprint checkdecls && leanblueprint pdf
      # The progress page for business readers, at /progress/, and the home
      # page, which shares its counts.
      - run: python3 scripts/render_progress.py
      - run: python3 scripts/render_home.py
      # The Explore page at /graph/: the area map, the dependency matrix, every
      # card, the history of milestones, and a card's neighbourhood.
      - run: python3 scripts/render_graph.py
      # /history/, which sends readers to the Explore page's History tab.
      - run: python3 scripts/render_history.py
      # A summary page per area, and the guided tour.
      - run: python3 scripts/render_areas.py
      - run: python3 scripts/render_tour.py
      # Parliament Air's policy pages at /airline/.  Fails if the wording cites
      # a requirement the model lacks, a criterion no longer open, or an
      # amount the facts lack.
      - run: python3 scripts/render_airline.py
      # The try-it panels: the Rust rules compiled to WebAssembly.
      - run: scripts/build-wasm.sh
      - run: scripts/assemble-site.sh
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  # Option 3, the Rust side: unit tests, and a check that the committed Lean
  # translation in Verify/Rust/ is what Charon and Aeneas generate from impl/rust.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path impl/rust/Cargo.toml
      - run: scripts/translate-rust.sh
      - name: Check Verify/Rust is up to date
        run: |
          if [ -n "$(git status --porcelain -- Verify/Rust)" ]; then
            git diff -- Verify/Rust
            echo "::error::Verify/Rust differs from the Rust code; run scripts/translate-rust.sh and commit Verify/Rust"
            exit 1
          fi
  # Deploys only once Pages is available for the repository: set the
  # repository variable PAGES_ENABLED to true after turning Pages on.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
