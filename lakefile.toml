name = "airline-order-verified"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Rules"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
doc.verso = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
rev = "v4.35.0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

# Aeneas's Lean library: the models of Rust's integers, options and results
# that Aeneas-generated code refers to.  Pinned to the commit of the Aeneas
# release whose binary generated Verify/Rust/ (nightly-2026.10.26-da2b22e).
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas.git"
rev = "da2b22e78d8fd5f076a902a5617c34038409fb79"
subDir = "backends/lean"

[[lean_lib]]
name = "Rules"

[[lean_exe]]
name = "status"
root = "Status.Main"
supportInterpreter = true

[[lean_lib]]
name = "Review"
srcDir = "Review"
roots = ["Review"]

[[lean_exe]]
name = "review-doc"
srcDir = "Review"
root = "Main"
# It loads the document's modules when it runs; see Review/Main.lean.
supportInterpreter = true

# The rules behind a JSON interface, for checking implementations in other
# languages.  The library holds the handler; the executable loads it into
# Lean's interpreter (see Oracle/Main.lean).
[[lean_lib]]
name = "Oracle"
roots = ["Oracle.Handle"]

[[lean_exe]]
name = "oracle"
root = "Oracle.Main"
supportInterpreter = true

# Verified Airline, the fictional airline whose site has its own repository:
# its fares as rules of the model, evaluated by the model's functions.  The
# executable loads the library into Lean's interpreter (see Airline/Facts.lean)
# and prints the facts the airline's pages read.  The names are outside Rules, so the
# status counts do not include them.
[[lean_lib]]
name = "Airline"
roots = ["Airline.Fares", "Airline.Evaluate"]

[[lean_exe]]
name = "airline-facts"
root = "Airline.Facts"
supportInterpreter = true

# Option 3: the Rust implementation, translated to Lean by Charon and Aeneas
# (Verify/Rust/, generated), and the proofs that it computes what the model
# computes (Verify/RustRules.lean).  Generated docstrings are plain text.
[[lean_lib]]
name = "Verify"
roots = ["Verify.Rust.OfferOrderRules", "Verify.RustRules"]
leanOptions = { doc.verso = false }
