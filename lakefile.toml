name = "business-rules-verified"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Rules"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
doc.verso = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
rev = "v4.36.0-rc1"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "Rules"

[[lean_exe]]
name = "status"
root = "Status.Main"
supportInterpreter = true

[[lean_lib]]
name = "Review"
srcDir = "Review"
roots = ["Review"]

[[lean_exe]]
name = "review-doc"
srcDir = "Review"
root = "Main"

# The rules behind a JSON interface, for checking implementations in other
# languages.  The library holds the handler; the executable loads it into
# Lean's interpreter (see Oracle/Main.lean).
[[lean_lib]]
name = "Oracle"
roots = ["Oracle.Handle"]

[[lean_exe]]
name = "oracle"
root = "Oracle.Main"
supportInterpreter = true
